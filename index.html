<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>我的灵动导航 | 简洁聚合页</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <div class="hero">
        <div class="logo-area">
            <div class="site-title">
                <h1>✨ 我的导航栈</h1>
                <div class="badge">聚合 · 直达</div>
            </div>
            <div class="toolbar">
                <button id="themeToggleBtn" class="icon-btn">🌓 暗色模式</button>
                <button id="layoutToggleBtn" class="icon-btn">📋 列表视图</button>
            </div>
        </div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜索网站名称、描述或标签..." autocomplete="off">
        </div>
    </div>

    <!-- 动态分类导航区域 -->
    <div id="categoriesContainer" class="categories">
        <!-- 通过js动态渲染 -->
        <div class="no-results" style="display: none;">✨ 没有找到相关链接，试试其他关键词吧</div>
    </div>

    <div class="footer">
        <p>⚡ 我的专属导航 · 收藏常用站点 | 点击卡片直接访问</p>
    </div>

    <!-- 侧边栏按钮触发器 -->
<div class="sidebar-trigger" id="sidebarTrigger">
    <button class="menu-btn">☰ 功能模块</button>
</div>

<!-- 侧边栏面板 -->
<div class="sidebar-panel" id="sidebarPanel">
    <div class="sidebar-header">
        <h3>⚡ 功能模块</h3>
        <button class="close-sidebar" id="closeSidebar">✕</button>
    </div>
    <div class="sidebar-content">
        <!-- 这里放置您的功能模块按钮 -->
        <button class="func-btn" data-action="bookmark">📖 书签管理</button>
        <button class="func-btn" data-action="export">📤 导出链接</button>
        <button class="func-btn" data-action="import">📥 导入链接</button>
        <button class="func-btn" data-action="clear">🗑️ 清除缓存</button>
        <button class="func-btn" data-action="stats">📊 使用统计</button>
    </div>
</div>


 -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>
</div>
<script src="style.js"></script>
</body>
</html>
