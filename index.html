<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>我的灵动导航 | 简洁聚合页</title>
    
</head>
<link rel="stylesheet" href="style.css">
<body>
<div class="container">
    <div class="hero">
        <div class="logo-area">
            <div class="site-title">
                <h1>✨ 我的导航栈</h1>
                <div class="badge">聚合 · 直达</div>
            </div>
            <div class="toolbar">
                <button id="themeToggleBtn" class="icon-btn">🌓 暗色模式</button>
                <button id="layoutToggleBtn" class="icon-btn">📋 列表视图</button>
            </div>
        </div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 搜索网站名称、描述或标签..." autocomplete="off">
        </div>
    </div>

    <div id="categoriesContainer" class="categories">
        <div class="no-results" style="display: none;">✨ 没有找到相关链接，试试其他关键词吧</div>
    </div>

    <div class="footer">
        <p>⚡ 我的专属导航 · 收藏常用站点 | 点击卡片直接访问</p>
    </div>
</div>

<!-- 全新侧边栏目录（目录导航，无功能按钮） -->
<div class="sidebar-trigger" id="sidebarTrigger">
    <button class="menu-btn">导航</button>
</div>

<div class="sidebar-panel" id="sidebarPanel">
    <div class="sidebar-header">
        <h3>📖 分类目录</h3>
        <button class="close-sidebar" id="closeSidebar">✕</button>
    </div>
    <div class="catalog-container" id="catalogContainer">
        <!-- 动态渲染目录列表 -->
        <div style="padding: 20px; text-align:center; color:#aaa;">加载中...</div>
    </div>
</div>
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<script src="style.js">
  
</script>
</body>
</html>
